<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly shift</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #8e8e93;
      --line: #e6e6e8;
      --sidebar: #f5f5f7;
      --weekend: #f6f6f8;
      --accent: #007aff;
      --today: #ff3b30;
      --bad: #d70015;
      --bad-bg: #ffebe9;
      --field: #f2f2f7;
      --exclude: #d70015;
      --limit: #e0c400;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: white;
      color: var(--ink);
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas:
        "sidebar toolbar"
        "sidebar stage";
    }
    .sidebar {
      grid-area: sidebar;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 18px 12px 28px;
    }
    .side-label {
      margin: 6px 8px 4px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .doctor { padding: 10px 8px 12px; }
    .doctor + .doctor { border-top: 1px solid var(--line); }
    .doctor h2 { margin: 0 0 8px; font-size: 13px; font-weight: 650; }
    .doctor-focus {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 2px 4px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      font-weight: 650;
    }
    .doctor-focus[aria-pressed="true"] { background: var(--tint); }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--tone);
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      flex: none;
    }
    .count {
      margin-left: auto;
      color: var(--muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .meaning {
      display: flex;
      gap: 6px;
      margin: 0 8px 8px;
    }
    .meaning span {
      display: inline-flex;
      align-items: center;
      height: 18px;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 650;
    }
    .prefs { display: grid; gap: 8px; }
    .wd-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }
    .wd, .block, .add-date, .mode-choice {
      background: white;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      color: var(--ink);
    }
    .wd {
      width: 100%;
      aspect-ratio: 1;
      height: auto;
      min-width: 0;
      padding: 0;
      border-radius: 0;
      font-size: 11px;
      font-weight: 590;
    }
    .wd-slot:not(:first-child) .wd { border-left-width: 0; }
    .wd-slot:first-child .wd { border-radius: 6px 0 0 6px; }
    .wd-slot:last-child .wd { border-radius: 0 6px 6px 0; }
    .wd.is-exclude { border-color: var(--exclude); }
    .wd.is-limit { border-color: var(--limit); }
    .wd:hover:not(.is-exclude):not(.is-limit) { background: #e8e8ed; }
    .is-exclude {
      background: var(--exclude);
      border-color: transparent;
      color: white;
    }
    .is-limit {
      background: var(--limit);
      border-color: transparent;
      color: var(--ink);
    }
    .wd.is-exclude:hover, .block:hover, .mode-choice.is-exclude:hover { filter: brightness(0.92); }
    .wd.is-limit:hover, .mode-choice.is-limit:hover { filter: brightness(0.95); }
    .wd-slot { position: relative; min-width: 0; }
    .wd-slot.is-open { z-index: 3; }
    .mode-tip {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      padding-top: 4px;
    }
    .wd-slot:nth-child(n + 5) .mode-tip { left: auto; right: 0; }
    .wd-slot.is-open .mode-tip { display: block; }
    .mode-tip-card {
      display: grid;
      gap: 4px;
      padding: 4px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 8px 20px rgba(0, 0, 0, 0.16);
    }
    .mode-choice {
      width: 76px;
      height: 26px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 650;
    }
    .mode-choice[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.45); }
    .date-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .date-head h3 {
      margin: 0;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .add-date {
      position: relative;
      width: 22px;
      height: 22px;
      padding: 0;
      font-size: 0;
      color: var(--ink);
    }
    .add-date::before,
    .add-date::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: currentColor;
      border-radius: 1px;
      transform: translate(-50%, -50%);
    }
    .add-date::before { width: 10px; height: 1.5px; }
    .add-date::after { width: 1.5px; height: 10px; }
    .add-date:hover { background: #e8e8ed; }
    .add-date[aria-expanded="true"],
    .add-date[aria-expanded="true"]:hover {
      background: var(--ink);
      border-color: transparent;
      color: white;
    }
    .rule-days { display: flex; flex-wrap: wrap; gap: 4px; }
    .block {
      min-width: 28px;
      height: 22px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 590;
      font-variant-numeric: tabular-nums;
    }
    .block-month {
      position: fixed;
      z-index: 6;
      width: 276px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: white;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 10px 28px rgba(0, 0, 0, 0.18);
    }
    .block-month p {
      margin: 0;
      padding: 8px 8px 0;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .block-month table { height: auto; }
    .block-month th { height: 22px; padding: 6px 0 4px; font-size: 11px; }
    .block-month td { height: 30px; text-align: center; vertical-align: middle; }
    .block-month .pick {
      width: 100%;
      height: 30px;
      border: 0;
      background: transparent;
      padding: 0;
    }
    .block-month .datenum { height: 30px; }
    .block-month .datenum.is-blocked .n {
      background: var(--exclude);
      color: white;
      font-weight: 650;
      border-radius: 6px;
    }
    .block-month .pick:hover .datenum:not(.is-today):not(.is-blocked) .n { background: #d1d1d6; }
    .issues { margin: 8px 4px 0; }
    .issues p {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--bad);
    }
    .issues ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .issues li {
      background: white;
      border: 1px solid #ffd0cc;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 12px;
      line-height: 1.35;
    }
    .toolbar {
      grid-area: toolbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 8px 16px;
      background: white;
    }
    .title-block { position: relative; min-width: 0; flex: 1; }
    .title-wrap { display: inline-grid; }
    .title-wrap h1, .title-wrap input { grid-area: 1 / 1; }
    h1 {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      font-size: 30px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .title-wrap input {
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .title-wrap:focus-within h1 {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 6px;
    }
    .status { margin: 3px 0 0; max-width: 560px; font-size: 12px; color: var(--muted); }
    .status.bad { color: var(--bad); }
    .status.quiet {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
    .nav { display: inline-flex; align-items: center; gap: 4px; }
    .nav button {
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      padding: 0 11px;
      font-size: 13px;
      font-weight: 510;
    }
    .nav button.icon {
      width: 28px;
      padding: 0;
      display: grid;
      place-items: center;
    }
    .nav button:hover { background: #e8e8ed; }
    .nav button:active { background: #dedee3; }
    #generate {
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 590;
    }
    #generate:hover { background: #0071eb; }
    #generate:disabled { opacity: 0.55; cursor: progress; }
    #copy {
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      padding: 0 12px;
      font-size: 13px;
      font-weight: 590;
    }
    #copy:hover { background: #e8e8ed; }
    #copy:disabled,
    #copy:disabled:hover { opacity: 0.55; background: var(--field); cursor: default; }
    .stage {
      grid-area: stage;
      position: relative;
      min-height: 0;
      background: white;
      overflow: auto;
    }
    #calendar { height: 100%; user-select: none; }
    table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
    th {
      height: 28px;
      padding: 2px 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      padding: 0;
    }
    tr td:last-child { border-right: 0; }
    td.weekend { background: var(--weekend); }
    .day, .cell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: transparent;
      border: 0;
      padding: 0;
      text-align: left;
      color: inherit;
    }
    .day.doctor-A, .day.doctor-B, .day.doctor-C, .day.doctor-D { background: var(--tint); }
    .day.dim { background: #ececef; }
    .day:hover { filter: brightness(0.97); }
    .day[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px; }
    .day:focus-visible { outline-offset: -2px; }
    .day {
      box-shadow:
        var(--seam-l, inset 0 0 0 transparent),
        var(--seam-r, inset 0 0 0 transparent),
        var(--seam-t, inset 0 0 0 transparent),
        var(--seam-b, inset 0 0 0 transparent);
    }
    .day.seam-left { --seam-l: inset 4px 0 0 var(--bad); }
    .day.seam-right { --seam-r: inset -4px 0 0 var(--bad); }
    .day.seam-sun { --seam-t: inset 0 4px 0 var(--bad); }
    .day.seam-sat { --seam-b: inset 0 -4px 0 var(--bad); }
    .corner {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--bad);
    }
    .datenum {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
      height: 28px;
      font-size: 12px;
      font-weight: 520;
      color: var(--ink);
    }
    .datenum .n {
      min-width: 22px;
      height: 22px;
      padding: 0 4px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 520;
    }
    .datenum .mon { font-weight: 520; }
    .datenum.is-out { color: #c7c7cc; }
    .datenum.is-today .n { background: var(--today); color: white; font-weight: 650; }
    .datenum.is-selected:not(.is-today) .n { background: #d1d1d6; font-weight: 650; }
    .holder {
      align-self: center;
      margin-top: 1px;
      font-size: 12px;
      font-weight: 650;
      color: var(--ink-tone);
    }
    .day.dim .holder { color: #aeaeb2; }
    .day.arriving {
      --arrive: var(--tint);
      animation: day-arrive 220ms ease both;
    }
    .day.arriving.dim { --arrive: #ececef; }
    .day.arriving .holder,
    .day.arriving .corner { animation: holder-arrive 220ms ease both; }
    @keyframes day-arrive {
      from {
        background: transparent;
        box-shadow: none;
      }
      to {
        background: var(--arrive);
        box-shadow:
          var(--seam-l, inset 0 0 0 transparent),
          var(--seam-r, inset 0 0 0 transparent),
          var(--seam-t, inset 0 0 0 transparent),
          var(--seam-b, inset 0 0 0 transparent);
      }
    }
    @keyframes holder-arrive {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .day.arriving,
      .day.arriving .holder,
      .day.arriving .corner { animation: none; }
    }
    .app.is-revealing .sidebar,
    .app.is-revealing #calendar,
    .app.is-revealing #chooser,
    .app.is-revealing #block-panel { pointer-events: none; }
    #chooser {
      position: absolute;
      z-index: 5;
      width: 228px;
      padding: 12px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 10px 28px rgba(0, 0, 0, 0.18);
    }
    #chooser p {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .choices { display: grid; gap: 6px; }
    .choice {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: var(--tint);
      color: var(--ink-tone);
      font-size: 13px;
      font-weight: 650;
      text-align: left;
    }
    .choice .dot { width: 8px; height: 8px; }
    .choice:hover { background: var(--tone); color: white; }
    .choice:hover .dot { background: white; box-shadow: none; }
    .doctor-A { --tone: #2f9e44; --tint: #d7f5df; --ink-tone: #176b32; }
    .doctor-B { --tone: #007aff; --tint: #d4e6ff; --ink-tone: #0047b3; }
    .doctor-C { --tone: #6d4aff; --tint: #e4dcff; --ink-tone: #4a2ec4; }
    .doctor-D { --tone: #d42d78; --tint: #fad4e6; --ink-tone: #9a1856; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .toolbar { order: 1; align-items: flex-start; }
      .stage { order: 2; min-height: 680px; }
      .sidebar { order: 3; border-right: 0; border-bottom: 1px solid var(--line); }
      .toolbar-actions { flex-wrap: wrap; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <p class="side-label">Doctors</p>
      <p class="meaning"><span class="is-exclude">Exclude</span><span class="is-limit">Limit</span></p>
      <section id="doctors" aria-label="Personal rules"></section>
      <div id="issues"></div>
    </aside>
    <header class="toolbar">
      <div class="title-block">
        <div class="title-wrap">
          <h1 id="month-title" aria-hidden="true"></h1>
          <input id="month" type="month" required aria-label="Month">
        </div>
        <p id="status" class="status" tabindex="-1" aria-live="polite">No plan yet.</p>
      </div>
      <div class="toolbar-actions">
        <div class="nav">
          <button id="prev" class="icon" type="button" aria-label="Previous month">
            <svg width="7" height="12" viewBox="0 0 7 12" aria-hidden="true"><path d="M6 1 1 6l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="today" type="button">Today</button>
          <button id="next" class="icon" type="button" aria-label="Next month">
            <svg width="7" height="12" viewBox="0 0 7 12" aria-hidden="true"><path d="M1 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button id="generate" type="button">Generate</button>
        <button id="copy" type="button" disabled>Copy</button>
      </div>
    </header>
    <main class="stage" aria-label="Plan">
      <div id="calendar"></div>
      <div id="chooser" hidden></div>
      <div id="block-panel" class="block-month" hidden></div>
    </main>
  </div>
  <script>
const DOCTORS = ["A", "B", "C", "D"];

function monthDays(year, monthIndex) {
  const n = new Date(year, monthIndex + 1, 0).getDate();
  const days = [];
  for (let day = 1; day <= n; day += 1) {
    days.push({ day, weekday: new Date(year, monthIndex, day).getDay() });
  }
  return days;
}

function blankRules() {
  const rules = {};
  for (const id of DOCTORS) {
    rules[id] = {
      mode: { 0: "free", 1: "free", 2: "free", 3: "free", 4: "free", 5: "free", 6: "free" },
      blocked: [],
    };
  }
  return rules;
}

function modeCode(mode) {
  if (mode === "ban") return 1;
  if (mode === "cap") return 2;
  return 0;
}

function prepare(days, rules) {
  const n = days.length;
  const minCount = Math.floor(n / 4);
  const maxCount = Math.ceil(n / 4);
  const weekday = new Uint8Array(n + 1);
  const blocked = [null, null, null, null].map(() => new Uint8Array(n + 1));
  const mode = [null, null, null, null].map(() => new Uint8Array(7));
  days.forEach((item, index) => {
    weekday[index + 1] = item.weekday;
  });
  DOCTORS.forEach((id, doctor) => {
    const rule = rules[id];
    for (let wd = 0; wd < 7; wd += 1) mode[doctor][wd] = modeCode(rule.mode[wd]);
    for (const day of rule.blocked) {
      if (day >= 1 && day <= n) blocked[doctor][day] = 1;
    }
  });
  return { n, minCount, maxCount, weekday, blocked, mode, days };
}

function explain(ctx, rules) {
  const { n, minCount, days, weekday, blocked, mode } = ctx;
  for (let day = 1; day <= n; day += 1) {
    const wd = weekday[day];
    let holder = false;
    for (let doctor = 0; doctor < 4; doctor += 1) {
      if (!blocked[doctor][day] && mode[doctor][wd] !== 1) holder = true;
    }
    if (!holder) {
      const when = formatDay(ctx, day);
      return `${when} has no legal holder. Every doctor excludes that day.`;
    }
  }

  const weekdayName = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  for (let wd = 1; wd <= 7; wd += 1) {
    const weekdayIndex = wd % 7;
    const dates = [];
    for (let day = 1; day <= n; day += 1) if (weekday[day] === weekdayIndex) dates.push(day);
    if (dates.length === 0) continue;
    let cover = 0;
    for (let doctor = 0; doctor < 4; doctor += 1) {
      const available = dates.filter((day) => !blocked[doctor][day]).length;
      const kind = mode[doctor][weekdayIndex];
      if (kind === 1 || available === 0) continue;
      cover += kind === 2 ? 1 : available;
    }
    if (cover < dates.length) {
      const name = weekdayName[weekdayIndex];
      return `${name} cannot be covered. Excludes and limits allow ${cover} Shift${cover === 1 ? "" : "s"} for ${dates.length} ${name}s.`;
    }
  }

  for (let doctor = 0; doctor < 4; doctor += 1) {
    let most = 0;
    for (let wd = 0; wd < 7; wd += 1) {
      if (mode[doctor][wd] === 1) continue;
      let available = 0;
      for (let day = 1; day <= n; day += 1) {
        if (weekday[day] === wd && !blocked[doctor][day]) available += 1;
      }
      if (available === 0) continue;
      most += mode[doctor][wd] === 2 ? 1 : available;
    }
    if (most < minCount) {
      return `${DOCTORS[doctor]} can hold at most ${most} Shift${most === 1 ? "" : "s"} under these rules. Balance needs at least ${minCount}.`;
    }
  }
  return "";
}

function formatDay(ctx, day) {
  const item = ctx.days[day - 1];
  if (item.year == null) return `Day ${day}`;
  return new Date(item.year, item.monthIndex, day).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "long",
    year: "numeric",
  });
}

function stretchKey(assignment) {
  const n = assignment.length;
  const stretches = [];
  for (let doctor = 0; doctor < 4; doctor += 1) {
    const held = [];
    for (let index = 0; index < n; index += 1) if (assignment[index] === doctor) held.push(index + 1);
    if (held.length === 0) {
      stretches.push(n);
      continue;
    }
    if (held[0] > 1) stretches.push(held[0] - 1);
    for (let i = 1; i < held.length; i += 1) {
      const gap = held[i] - held[i - 1] - 1;
      if (gap > 0) stretches.push(gap);
    }
    if (held[held.length - 1] < n) stretches.push(n - held[held.length - 1]);
  }
  stretches.sort((a, b) => b - a);
  return stretches;
}

function hasCap(ctx, doctor) {
  for (let wd = 0; wd < 7; wd += 1) if (ctx.mode[doctor][wd] === 2) return true;
  return false;
}

function canHold(ctx, doctor, day) {
  const wd = ctx.weekday[day];
  return !ctx.blocked[doctor][day] && ctx.mode[doctor][wd] !== 1;
}

function stretchLowerBound(ctx) {
  const must = [0, 1, 2, 3].map(() => []);
  for (let day = 1; day <= ctx.n; day += 1) {
    const possible = [];
    for (let doctor = 0; doctor < 4; doctor += 1) if (canHold(ctx, doctor, day)) possible.push(doctor);
    if (possible.length === 1) must[possible[0]].push(day);
  }

  let bound = 0;
  for (let doctor = 0; doctor < 4; doctor += 1) {
    if (hasCap(ctx, doctor)) continue;
    const needed = new Set(must[doctor]);
    let lo = 0;
    let hi = ctx.n;
    let best = null;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (fitsStretch(ctx, doctor, needed, mid)) {
        best = mid;
        hi = mid - 1;
      } else lo = mid + 1;
    }
    if (best === null) return Number.POSITIVE_INFINITY;
    if (best > bound) bound = best;
  }
  return bound;
}

function fitsStretch(ctx, doctor, needed, limit) {
  const n = ctx.n;
  const maxK = ctx.maxCount;
  let prev = Array.from({ length: maxK + 1 }, () => new Uint8Array(n + 1));
  prev[0][0] = 1;
  for (let day = 1; day <= n; day += 1) {
    const next = Array.from({ length: maxK + 1 }, () => new Uint8Array(n + 1));
    for (let used = 0; used <= maxK; used += 1) {
      for (let last = 0; last < day; last += 1) {
        if (!prev[used][last]) continue;
        if (!needed.has(day) && day - last <= limit) next[used][last] = 1;
        if (used < maxK && canHold(ctx, doctor, day) && (last === 0 || day !== last + 1)) {
          if (day - last - 1 <= limit) next[used + 1][day] = 1;
        }
      }
    }
    prev = next;
  }
  for (let used = ctx.minCount; used <= maxK; used += 1) {
    for (let last = 0; last <= n; last += 1) {
      if (prev[used][last] && n - last <= limit) return true;
    }
  }
  return false;
}

function betterTallies(a, b) {
  for (let stretch = a.length - 1; stretch >= 1; stretch -= 1) {
    if (a[stretch] !== b[stretch]) return a[stretch] < b[stretch];
  }
  return false;
}

function sameTallies(a, b) {
  for (let stretch = 1; stretch < a.length; stretch += 1) if (a[stretch] !== b[stretch]) return false;
  return true;
}

function talliesToKey(tallies) {
  const key = [];
  for (let stretch = tallies.length - 1; stretch >= 1; stretch -= 1) {
    for (let count = 0; count < tallies[stretch]; count += 1) key.push(stretch);
  }
  return key;
}

function isWeekendDay(weekday) {
  return weekday === 0 || weekday === 6;
}

function perfectWeekend(ctx) {
  let weekendDays = 0;
  for (let day = 1; day <= ctx.n; day += 1) {
    if (isWeekendDay(ctx.weekday[day])) weekendDays += 1;
  }
  const base = Math.floor(weekendDays / 4);
  const extra = weekendDays % 4;
  const key = [0, 0, 0, 0];
  for (let i = 0; i < 4; i += 1) key[i] = base + (i < extra ? 1 : 0);
  return key;
}

function weekendKey(assignment, days) {
  const counts = [0, 0, 0, 0];
  for (let index = 0; index < assignment.length; index += 1) {
    if (isWeekendDay(days[index].weekday)) counts[assignment[index]] += 1;
  }
  counts.sort((a, b) => b - a);
  return counts;
}

function betterWeekend(a, b) {
  for (let i = 0; i < 4; i += 1) if (a[i] !== b[i]) return a[i] < b[i];
  return false;
}

function weekendPerms(target) {
  const values = target.slice().sort((a, b) => a - b);
  const out = [];
  const used = [0, 0, 0, 0];
  const perm = [0, 0, 0, 0];
  function rec(index) {
    if (index === 4) {
      out.push(perm.slice());
      return;
    }
    for (let slot = 0; slot < 4; slot += 1) {
      if (used[slot]) continue;
      if (slot > 0 && values[slot] === values[slot - 1] && !used[slot - 1]) continue;
      used[slot] = 1;
      perm[index] = values[slot];
      rec(index + 1);
      used[slot] = 0;
    }
  }
  rec(0);
  return out;
}

function canReachWeekend(partial, perms) {
  for (let p = 0; p < perms.length; p += 1) {
    const perm = perms[p];
    let fits = true;
    for (let doctor = 0; doctor < 4; doctor += 1) {
      if (partial[doctor] > perm[doctor]) {
        fits = false;
        break;
      }
    }
    if (fits) return true;
  }
  return false;
}

function discoverWeekend(ctx) {
  const { n, maxCount, minCount, weekday, mode } = ctx;
  const slots = [];
  const slotAt = [0, 1, 2, 3].map(() => new Int8Array(7).fill(-1));
  for (let doctor = 0; doctor < 4; doctor += 1) {
    for (let wd = 0; wd < 7; wd += 1) {
      if (mode[doctor][wd] === 2) {
        slotAt[doctor][wd] = slots.length;
        slots.push(1);
      }
    }
  }

  let layer = new Map();
  layer.set(`0000|-1|0000|${"0".repeat(slots.length)}`, {
    counts: [0, 0, 0, 0],
    last: -1,
    weekends: [0, 0, 0, 0],
    cap: slots.length ? new Uint8Array(slots.length) : new Uint8Array(0),
  });
  let nodes = 1;

  for (let day = 1; day <= n; day += 1) {
    const next = new Map();
    const wd = weekday[day];
    const weekend = isWeekendDay(wd);
    for (const state of layer.values()) {
      for (let doctor = 0; doctor < 4; doctor += 1) {
        if (state.last === doctor) continue;
        if (!canHold(ctx, doctor, day) || state.counts[doctor] >= maxCount) continue;
        const slot = slots.length ? slotAt[doctor][wd] : -1;
        if (slot >= 0 && state.cap[slot]) continue;
        const newWeekends = state.weekends.slice();
        if (weekend) newWeekends[doctor] += 1;
        const newCounts = state.counts.slice();
        newCounts[doctor] += 1;
        const newCap = state.cap.slice();
        if (slot >= 0) newCap[slot] = 1;
        const key = `${newCounts.join("")}|${doctor}|${newWeekends.join("")}|${newCap.join("")}`;
        if (next.has(key)) continue;
        next.set(key, { counts: newCounts, last: doctor, weekends: newWeekends, cap: newCap });
      }
    }
    nodes += next.size;
    if (next.size === 0) return { key: null, nodes };
    layer = next;
  }

  let best = null;
  for (const state of layer.values()) {
    if (state.counts.some((value) => value < minCount)) continue;
    const key = state.weekends.slice().sort((a, b) => b - a);
    if (!best || betterWeekend(key, best)) best = key;
  }
  return { key: best, nodes };
}

function searchLimit(ctx, limit, rng, target) {
  const perms = weekendPerms(target);
  const { n, maxCount, minCount, weekday, mode } = ctx;
  const history = limit + 1;
  const window = limit + 1;
  const slots = [];
  const slotAt = [0, 1, 2, 3].map(() => new Int8Array(7).fill(-1));
  for (let doctor = 0; doctor < 4; doctor += 1) {
    for (let wd = 0; wd < 7; wd += 1) {
      if (mode[doctor][wd] === 2) {
        slotAt[doctor][wd] = slots.length;
        slots.push(1);
      }
    }
  }

  const layers = [];
  let layer = new Map();
  layer.set(`0000||${"0".repeat(slots.length)}|0000`, {
    hist: [],
    counts: [0, 0, 0, 0],
    cap: slots.length ? new Uint8Array(slots.length) : new Uint8Array(0),
    weekends: [0, 0, 0, 0],
    tallies: new Uint16Array(limit + 1),
    ways: 1,
    pred: [0, 0, 0, 0],
  });
  layers[0] = layer;
  let nodes = 1;

  for (let day = 1; day <= n; day += 1) {
    const next = new Map();
    const wd = weekday[day];
    for (const state of layer.values()) {
      for (let doctor = 0; doctor < 4; doctor += 1) {
        if (state.hist.length && state.hist[state.hist.length - 1] === doctor) continue;
        if (!canHold(ctx, doctor, day) || state.counts[doctor] >= maxCount) continue;
        const slot = slots.length ? slotAt[doctor][wd] : -1;
        if (slot >= 0 && state.cap[slot]) continue;
        const newWeekends = state.weekends.slice();
        if (isWeekendDay(wd)) {
          newWeekends[doctor] += 1;
          if (!canReachWeekend(newWeekends, perms)) continue;
        }

        let prevDay = 0;
        for (let index = 0; index < state.hist.length; index += 1) {
          if (state.hist[index] === doctor) prevDay = day - state.hist.length + index;
        }
        const tallies = state.tallies.slice();
        if (prevDay === 0) {
          if (day - 1 > limit) continue;
          if (day > 1) tallies[day - 1] += 1;
        } else {
          const gap = day - prevDay - 1;
          if (gap > limit) continue;
          if (gap > 0) tallies[gap] += 1;
        }

        const dropping = state.hist.length === history;
        if (day >= window) {
          const seen = new Set(dropping ? state.hist.slice(1) : state.hist);
          seen.add(doctor);
          if (seen.size < 4) continue;
        }

        const newHist = dropping ? state.hist.slice(1).concat(doctor) : state.hist.concat(doctor);
        const newCounts = state.counts.slice();
        newCounts[doctor] += 1;
        const newCap = state.cap.slice();
        if (slot >= 0) newCap[slot] = 1;
        const key = `${newCounts.join("")}|${newHist.join("")}|${newCap.join("")}|${newWeekends.join("")}`;
        const dropped = dropping ? state.hist[0] : -1;
        const existing = next.get(key);
        if (!existing || betterTallies(tallies, existing.tallies)) {
          const pred = [0, 0, 0, 0];
          if (dropped >= 0) pred[dropped] = state.ways;
          next.set(key, {
            hist: newHist,
            counts: newCounts,
            cap: newCap,
            weekends: newWeekends,
            tallies,
            ways: state.ways,
            pred,
          });
        } else if (sameTallies(tallies, existing.tallies)) {
          existing.ways += state.ways;
          if (dropped >= 0) existing.pred[dropped] += state.ways;
        }
      }
    }
    nodes += next.size;
    if (next.size === 0) return { nodes, chosen: null, ties: 0, key: null };
    layer = next;
    layers[day] = layer;
  }

  let best = null;
  let total = 0;
  const endings = [];
  for (const state of layer.values()) {
    if (state.counts.some((value, doctor) => value < minCount)) continue;
    const sortedWeekends = state.weekends.slice().sort((a, b) => b - a);
    let reached = true;
    for (let i = 0; i < 4; i += 1) if (sortedWeekends[i] !== target[i]) reached = false;
    if (!reached) continue;
    const finalTallies = state.tallies.slice();
    for (let doctor = 0; doctor < 4; doctor += 1) {
      let lastDay = 0;
      for (let index = 0; index < state.hist.length; index += 1) {
        if (state.hist[index] === doctor) lastDay = n - state.hist.length + 1 + index;
      }
      const after = n - lastDay;
      if (after > 0) finalTallies[after] += 1;
    }
    if (!best || betterTallies(finalTallies, best)) {
      best = finalTallies;
      endings.length = 0;
      total = 0;
    }
    if (sameTallies(finalTallies, best)) {
      endings.push(state);
      total += state.ways;
    }
  }
  if (!total) return { nodes, chosen: null, ties: 0, key: null };

  let ticket = Math.floor(rng() * total);
  let chosenState = endings[endings.length - 1];
  for (const state of endings) {
    if (ticket < state.ways) {
      chosenState = state;
      break;
    }
    ticket -= state.ways;
  }

  const plan = new Array(n);
  let state = chosenState;
  for (let day = n; day >= 1; day -= 1) {
    const doctor = state.hist[state.hist.length - 1];
    plan[day - 1] = doctor;
    if (day === 1) break;
    let prevHist;
    if (day > history) {
      let cursor = Math.floor(rng() * state.pred.reduce((sum, value) => sum + value, 0));
      let dropped = 0;
      for (; dropped < 3; dropped += 1) {
        if (cursor < state.pred[dropped]) break;
        cursor -= state.pred[dropped];
      }
      prevHist = [dropped].concat(state.hist.slice(0, -1));
    } else {
      prevHist = state.hist.slice(0, -1);
    }
    const prevCounts = state.counts.slice();
    prevCounts[doctor] -= 1;
    const prevCap = state.cap.slice();
    const slot = slotAt[doctor][weekday[day]];
    if (slot >= 0) prevCap[slot] = 0;
    const prevWeekends = state.weekends.slice();
    if (isWeekendDay(weekday[day])) prevWeekends[doctor] -= 1;
    const prevKey = `${prevCounts.join("")}|${prevHist.join("")}|${prevCap.join("")}|${prevWeekends.join("")}`;
    state = layers[day - 1].get(prevKey);
  }

  return { nodes, chosen: plan, ties: total, key: talliesToKey(best) };
}

function solve(days, rules, rng = Math.random) {
  const dated = days.map((item) => ({ ...item }));
  const ctx = prepare(dated, rules);
  const reason = explain(ctx, rules);
  if (reason) return { ok: false, reason, nodes: 0, ties: 0 };

  const lower = stretchLowerBound(ctx);
  if (!Number.isFinite(lower)) {
    return {
      ok: false,
      reason: "No plan meets these rules. Consecutive Shifts and the personal rules cannot be satisfied together.",
      nodes: 0,
      ties: 0,
      truncated: false,
      lower,
    };
  }
  let nodes = 0;
  const perfect = perfectWeekend(ctx);
  const quick = searchLimit(ctx, lower, rng, perfect);
  nodes += quick.nodes;
  if (quick.chosen) {
    return {
      ok: true,
      days: quick.chosen.map((doctor) => DOCTORS[doctor]),
      key: quick.key,
      weekend: perfect,
      nodes,
      ties: quick.ties,
      truncated: false,
      lower,
    };
  }
  const discovered = discoverWeekend(ctx);
  nodes += discovered.nodes;
  if (!discovered.key) {
    return {
      ok: false,
      reason: "No plan meets these rules. Consecutive Shifts and the personal rules cannot be satisfied together.",
      nodes,
      ties: 0,
      truncated: false,
      lower,
    };
  }
  for (let limit = lower; limit <= ctx.n; limit += 1) {
    const found = searchLimit(ctx, limit, rng, discovered.key);
    nodes += found.nodes;
    if (!found.chosen) continue;
    return {
      ok: true,
      days: found.chosen.map((doctor) => DOCTORS[doctor]),
      key: found.key,
      weekend: discovered.key,
      nodes,
      ties: found.ties,
      truncated: false,
      lower,
    };
  }
  return {
    ok: false,
    reason: "No plan meets these rules. Consecutive Shifts and the personal rules cannot be satisfied together.",
    nodes,
    ties: 0,
    truncated: false,
    lower,
  };
}

function evaluate(days, rules, letters) {
  const ctx = prepare(days, rules);
  const assignment = letters.map((letter) => DOCTORS.indexOf(letter));
  const issues = [];
  for (let index = 1; index < assignment.length; index += 1) {
    if (assignment[index] === assignment[index - 1]) {
      issues.push({ type: "consecutive", days: [index, index + 1], doctor: DOCTORS[assignment[index]] });
    }
  }
  for (let index = 0; index < assignment.length; index += 1) {
    const doctor = assignment[index];
    const day = index + 1;
    const wd = ctx.weekday[day];
    if (ctx.blocked[doctor][day]) issues.push({ type: "blocked", days: [day], doctor: DOCTORS[doctor] });
    else if (ctx.mode[doctor][wd] === 1) issues.push({ type: "ban", days: [day], doctor: DOCTORS[doctor] });
  }
  for (let doctor = 0; doctor < 4; doctor += 1) {
    for (let wd = 0; wd < 7; wd += 1) {
      if (ctx.mode[doctor][wd] !== 2) continue;
      const held = [];
      for (let day = 1; day <= ctx.n; day += 1) {
        if (ctx.weekday[day] === wd && assignment[day - 1] === doctor) held.push(day);
      }
      if (held.length > 1) issues.push({ type: "cap", days: held, doctor: DOCTORS[doctor], weekday: wd });
    }
  }
  const counts = [0, 0, 0, 0];
  for (const doctor of assignment) counts[doctor] += 1;
  if (Math.max(...counts) - Math.min(...counts) > 1) {
    issues.push({ type: "balance", counts: counts.map((value, doctor) => [DOCTORS[doctor], value]) });
  }
  return issues;
}

const STORAGE_KEY = "turbo-shift-v1";
const WEEKDAYS = [[0, "Sun"], [1, "Mon"], [2, "Tue"], [3, "Wed"], [4, "Thu"], [5, "Fri"], [6, "Sat"]];
const WEEKDAY_NAME = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const monthInput = document.querySelector("#month");
const monthTitleEl = document.querySelector("#month-title");
const generateButton = document.querySelector("#generate");
const copyButton = document.querySelector("#copy");
let copyTimer = 0;
const doctorsEl = document.querySelector("#doctors");
const statusEl = document.querySelector("#status");
const chooserEl = document.querySelector("#chooser");
const calendarEl = document.querySelector("#calendar");
const issuesEl = document.querySelector("#issues");
const blockPanelEl = document.querySelector("#block-panel");

let state = loadState();
let focusDoctor = null;
let blockDoctor = null;
let weekdayPick = null;
let revealing = false;
let generateTicket = 0;
let revealTimer = 0;
const REVEAL_HOLD = 300;
const REVEAL_GAP = 250;
const REVEAL_FADE = 220;
const appEl = document.querySelector(".app");

function currentMonthValue() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
}

function parseMonth(value) {
  const match = /^(\d{4})-(\d{2})$/.exec(value || "");
  if (!match) return null;
  const monthIndex = Number(match[2]) - 1;
  if (monthIndex < 0 || monthIndex > 11) return null;
  return { year: Number(match[1]), monthIndex, value: `${match[1]}-${match[2]}` };
}

function datedDays(parsed) {
  return monthDays(parsed.year, parsed.monthIndex).map((item) => ({
    ...item,
    year: parsed.year,
    monthIndex: parsed.monthIndex,
  }));
}

function beTitle(parsed) {
  return `${MONTHS[parsed.monthIndex]} ${parsed.year + 543} BE`;
}

function monthGrid(parsed) {
  const first = new Date(parsed.year, parsed.monthIndex, 1);
  const last = new Date(parsed.year, parsed.monthIndex + 1, 0);
  const start = new Date(parsed.year, parsed.monthIndex, 1 - first.getDay());
  const end = new Date(parsed.year, parsed.monthIndex, last.getDate() + (6 - last.getDay()));
  const dates = [];
  for (let cursor = new Date(start); cursor <= end; cursor.setDate(cursor.getDate() + 1)) {
    dates.push(new Date(cursor));
  }
  return dates;
}

function loadState() {
  const fresh = () => ({ month: currentMonthValue(), rules: blankRules(), grid: null, selected: null, reason: "" });
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    const parsed = saved && parseMonth(saved.month);
    if (!parsed || !saved.rules) return fresh();
    const days = datedDays(parsed);
    const rules = blankRules();
    for (const id of DOCTORS) {
      const incoming = saved.rules[id] || {};
      for (let wd = 0; wd < 7; wd += 1) {
        const mode = incoming.mode?.[wd] ?? incoming.mode?.[String(wd)];
        if (mode === "free" || mode === "ban" || mode === "cap") rules[id].mode[wd] = mode;
      }
      if (Array.isArray(incoming.blocked)) {
        rules[id].blocked = incoming.blocked.filter((day) => Number.isInteger(day) && day >= 1 && day <= days.length);
      }
    }
    const grid = Array.isArray(saved.grid) && saved.grid.length === days.length && saved.grid.every((id) => DOCTORS.includes(id))
      ? saved.grid.slice()
      : null;
    return { month: parsed.value, rules, grid, selected: null, reason: "" };
  } catch {
    return fresh();
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ month: state.month, rules: state.rules, grid: state.grid }));
}

function formatDate(parsed, day) {
  return new Date(parsed.year, parsed.monthIndex, day).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "long",
    year: "numeric",
  });
}

function weekdayRules(id, rule) {
  const buttons = WEEKDAYS.map(([wd, label]) => {
    const mode = rule.mode[wd];
    const cls = ["wd"];
    if (mode === "ban") cls.push("is-exclude");
    else if (mode === "cap") cls.push("is-limit");
    const meaning = mode === "ban" ? ", excluded" : mode === "cap" ? ", limited" : "";
    const open = mode === "free" && weekdayPick && weekdayPick.id === id && weekdayPick.wd === wd;
    const tip = open
      ? `<div class="mode-tip" id="mode-pick">
          <div class="mode-tip-card" role="group" aria-label="${WEEKDAY_NAME[wd]} for ${id}">
            <button type="button" class="mode-choice is-exclude" data-pick-mode="ban" data-doctor="${id}" data-pick-weekday="${wd}">Exclude</button>
            <button type="button" class="mode-choice is-limit" data-pick-mode="cap" data-doctor="${id}" data-pick-weekday="${wd}">Limit</button>
          </div>
        </div>`
      : "";
    return `<div class="wd-slot${open ? " is-open" : ""}">
      <button type="button" class="${cls.join(" ")}" data-weekday="${wd}" data-doctor="${id}" aria-pressed="${mode !== "free"}"${open ? ` aria-expanded="true" aria-controls="mode-pick"` : ""} aria-label="${WEEKDAY_NAME[wd]} for ${id}${meaning}">${label}</button>
      ${tip}
    </div>`;
  }).join("");
  return `<div class="wd-grid">${buttons}</div>`;
}

function renderCounts() {
  const tally = Object.fromEntries(DOCTORS.map((id) => [id, 0]));
  const show = Boolean(state.grid) && !revealing;
  if (show) for (const id of state.grid) tally[id] += 1;
  for (const id of DOCTORS) {
    const el = doctorsEl.querySelector(`[data-count="${id}"]`);
    if (el) el.textContent = show ? String(tally[id]) : "";
  }
}

function syncRevealLock() {
  appEl.classList.toggle("is-revealing", revealing);
  calendarEl.toggleAttribute("inert", revealing);
  doctorsEl.toggleAttribute("inert", revealing);
  blockPanelEl.toggleAttribute("inert", revealing);
  calendarEl.setAttribute("aria-busy", revealing ? "true" : "false");
}

function blockPanel(id, parsed) {
  const blocked = new Set(state.rules[id].blocked);
  const now = new Date();
  const cells = monthGrid(parsed).map((date) => {
    const inMonth = date.getFullYear() === parsed.year && date.getMonth() === parsed.monthIndex;
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    const day = date.getDate();
    const isToday = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
    const tdClass = weekend ? "weekend" : "";
    if (!inMonth) {
      return `<td class="${tdClass}"><span class="datenum is-out"><span class="n">${day}</span></span></td>`;
    }
    const pressed = blocked.has(day);
    const numClass = ["datenum"];
    if (pressed) numClass.push("is-blocked");
    else if (isToday) numClass.push("is-today");
    const verb = pressed ? "Clear excluded" : "Exclude";
    return `<td class="${tdClass}"><button type="button" class="pick" data-block-day="${day}" data-doctor="${id}" aria-pressed="${pressed}"${isToday ? ` aria-current="date"` : ""} aria-label="${verb} ${formatDate(parsed, day)} for ${id}"><span class="${numClass.join(" ")}"><span class="n">${day}</span></span></button></td>`;
  });
  const rows = [];
  for (let index = 0; index < cells.length; index += 7) rows.push(`<tr>${cells.slice(index, index + 7).join("")}</tr>`);
  const head = WEEKDAYS.map(([, label]) => `<th scope="col">${label}</th>`).join("");
  return `<p>Choose dates</p><table aria-label="Excluded dates for ${id}"><thead><tr>${head}</tr></thead><tbody>${rows.join("")}</tbody></table>`;
}

function placeBlockPanel() {
  if (blockPanelEl.hidden || !blockDoctor) return;
  const anchor = doctorsEl.querySelector(`[data-block-add="${blockDoctor}"]`);
  if (!anchor) return;
  const margin = 8;
  const gap = 6;
  const width = Math.min(276, window.innerWidth - margin * 2);
  blockPanelEl.style.width = `${width}px`;
  const anchorRect = anchor.getBoundingClientRect();
  let left = anchorRect.right - width;
  let top = anchorRect.bottom + gap;
  blockPanelEl.style.left = `${left}px`;
  blockPanelEl.style.top = `${top}px`;
  const height = blockPanelEl.offsetHeight;
  if (top + height > window.innerHeight - margin) top = anchorRect.top - height - gap;
  if (top < margin) top = margin;
  if (left < margin) left = margin;
  if (left + width > window.innerWidth - margin) left = window.innerWidth - width - margin;
  blockPanelEl.style.left = `${left}px`;
  blockPanelEl.style.top = `${top}px`;
}

function renderBlockPanel() {
  if (!blockDoctor) {
    blockPanelEl.hidden = true;
    blockPanelEl.innerHTML = "";
    delete blockPanelEl.dataset.blockPanel;
    return;
  }
  blockPanelEl.hidden = false;
  blockPanelEl.dataset.blockPanel = blockDoctor;
  blockPanelEl.innerHTML = blockPanel(blockDoctor, parseMonth(state.month));
  placeBlockPanel();
}

function renderDoctors() {
  const parsed = parseMonth(state.month);
  doctorsEl.innerHTML = DOCTORS.map((id) => {
    const rule = state.rules[id];
    const chips = rule.blocked.map((day) => `
      <button type="button" class="block is-exclude" data-doctor="${id}" data-day="${day}" aria-label="Clear excluded ${formatDate(parsed, day)} for ${id}">${day}</button>`).join("");
    const open = blockDoctor === id;
    return `
      <article class="doctor doctor-${id}">
        <h2><button type="button" class="doctor-focus" data-focus="${id}" aria-pressed="${focusDoctor === id}" aria-label="${focusDoctor === id ? `Showing ${id} on the month` : `Show ${id} on the month`}"><span class="dot" aria-hidden="true"></span>${id}<span class="count" data-count="${id}"></span></button></h2>
        <div class="prefs">
          ${weekdayRules(id, rule)}
          <div class="dates">
            <div class="date-head">
              <h3>Excluded dates</h3>
              <button type="button" class="add-date" data-block-add="${id}" aria-expanded="${open}"${open ? ` aria-controls="block-panel"` : ""} aria-label="Add an excluded date for ${id}">+</button>
            </div>
            ${chips ? `<div class="rule-days">${chips}</div>` : ""}
          </div>
        </div>
      </article>`;
  }).join("");
  renderCounts();
  renderBlockPanel();
  syncRevealLock();
}

function issueText(parsed, issue) {
  const when = (day) => formatDate(parsed, day);
  if (issue.type === "consecutive") return `${issue.doctor} holds ${when(issue.days[0])} and ${when(issue.days[1])}.`;
  if (issue.type === "blocked") return `${issue.doctor} holds ${when(issue.days[0])}, which is an excluded date.`;
  if (issue.type === "ban") return `${issue.doctor} holds ${when(issue.days[0])}, which is an excluded weekday.`;
  if (issue.type === "cap") {
    const name = WEEKDAY_NAME[issue.weekday];
    return `${issue.doctor} is over the ${name} limit: ${issue.days.map(when).join(" and ")}.`;
  }
  const counts = issue.counts.map(([id, value]) => `${id} ${value}`).join(", ");
  return `Balance is missed. Shifts are ${counts}.`;
}

function placeChooser() {
  const anchor = calendarEl.querySelector(`[data-select="${state.selected}"]`);
  const stage = calendarEl.closest(".stage");
  if (!anchor || !stage) return;
  const a = anchor.getBoundingClientRect();
  const s = stage.getBoundingClientRect();
  const margin = 8;
  const width = chooserEl.offsetWidth;
  const height = chooserEl.offsetHeight;
  let left = a.left - s.left + stage.scrollLeft + margin;
  let top = a.bottom - s.top + stage.scrollTop + 6;
  const limitX = stage.scrollLeft + s.width;
  const limitY = stage.scrollTop + s.height;
  if (left + width > limitX - margin) left = limitX - width - margin;
  if (left < stage.scrollLeft + margin) left = stage.scrollLeft + margin;
  if (top + height > limitY - margin) top = a.top - s.top + stage.scrollTop - height - 6;
  if (top < stage.scrollTop + margin) top = stage.scrollTop + margin;
  chooserEl.style.left = `${left}px`;
  chooserEl.style.top = `${top}px`;
}

function renderBoard() {
  const parsed = parseMonth(state.month);
  const days = datedDays(parsed);
  const issues = state.grid ? evaluate(days, state.rules, state.grid) : [];
  const corners = new Set();
  for (const issue of issues) {
    if (issue.type === "blocked" || issue.type === "ban" || issue.type === "cap") {
      for (const day of issue.days) corners.add(day);
    }
  }
  const seams = new Map();
  const markSeam = (day, edge) => {
    const entry = seams.get(day) || {};
    entry[edge] = true;
    seams.set(day, entry);
  };
  if (state.grid) {
    for (let day = 1; day < state.grid.length; day += 1) {
      if (state.grid[day - 1] !== state.grid[day]) continue;
      const weekday = new Date(parsed.year, parsed.monthIndex, day).getDay();
      if (weekday === 6) markSeam(day, "sat");
      else markSeam(day, "right");
    }
  }
  const now = new Date();
  const title = beTitle(parsed);

  monthTitleEl.textContent = title;
  monthInput.setAttribute("aria-label", title);
  document.title = `${title} · Monthly shift`;

  if (revealing) {
    statusEl.textContent = "No plan yet.";
    statusEl.classList.remove("bad", "quiet");
  } else if (state.reason) {
    statusEl.textContent = state.reason;
    statusEl.classList.add("bad");
    statusEl.classList.remove("quiet");
  } else if (!state.grid) {
    statusEl.textContent = "No plan yet.";
    statusEl.classList.remove("bad", "quiet");
  } else if (issues.length) {
    statusEl.textContent = "This grid breaks a rule.";
    statusEl.classList.add("bad");
    statusEl.classList.remove("quiet");
  } else {
    statusEl.textContent = "Plan ready.";
    statusEl.classList.remove("bad");
    statusEl.classList.add("quiet");
  }

  const selected = revealing ? null : state.selected;
  if (selected && state.grid) {
    const holder = state.grid[selected - 1];
    const others = DOCTORS.filter((id) => id !== holder).map((id) =>
      `<button type="button" class="choice doctor-${id}" data-reassign="${id}"><span class="dot" aria-hidden="true"></span>${id}</button>`).join("");
    chooserEl.hidden = false;
    chooserEl.innerHTML = `<p>Give ${formatDate(parsed, selected)} to</p><div class="choices">${others}</div>`;
  } else {
    chooserEl.hidden = true;
    chooserEl.innerHTML = "";
  }

  const cells = monthGrid(parsed).map((date, index) => {
    const inMonth = date.getFullYear() === parsed.year && date.getMonth() === parsed.monthIndex;
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    const isToday = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
    const day = date.getDate();
    const numClass = ["datenum"];
    if (!inMonth) numClass.push("is-out");
    if (isToday) numClass.push("is-today");
    if (inMonth && selected === day) numClass.push("is-selected");
    const mon = day === 1 ? `<span class="mon">${MONTHS_SHORT[date.getMonth()]}</span>` : "";
    const num = `<span class="${numClass.join(" ")}"><span class="n">${day}</span>${mon}</span>`;
    const tdClass = weekend ? "weekend" : "";
    if (!inMonth || !state.grid) {
      return `<td class="${tdClass}"><div class="cell"${isToday ? ` aria-current="date"` : ""}>${num}</div></td>`;
    }
    const holder = state.grid[day - 1];
    const pressed = selected === day;
    const seam = seams.get(day) || {};
    const corner = corners.has(day);
    const dim = focusDoctor && holder !== focusDoctor;
    const row = Math.floor(index / 7);
    const arrive = revealing ? ` style="animation-delay:${REVEAL_HOLD + row * REVEAL_GAP}ms"` : "";
    const dayClass = [
      "day",
      `doctor-${holder}`,
      dim ? "dim" : "",
      revealing ? "arriving" : "",
      seam.left ? "seam-left" : "",
      seam.right ? "seam-right" : "",
      seam.sat ? "seam-sat" : "",
      seam.sun ? "seam-sun" : "",
    ].filter(Boolean).join(" ");
    const notes = [];
    if (seam.left || seam.right || seam.sat || seam.sun) notes.push("consecutive");
    if (corner) notes.push("broken");
    return `<td class="${tdClass}"><button type="button" class="${dayClass}" data-doctor="${holder}" data-select="${day}" aria-pressed="${pressed}"${isToday ? ` aria-current="date"` : ""} aria-label="${formatDate(parsed, day)}, ${holder}${notes.length ? `, ${notes.join(", ")}` : ""}"${arrive}>${num}<span class="holder"${arrive}>${holder}</span>${corner ? `<span class="corner" aria-hidden="true"${arrive}></span>` : ""}</button></td>`;
  });
  const rows = [];
  for (let index = 0; index < cells.length; index += 7) rows.push(`<tr>${cells.slice(index, index + 7).join("")}</tr>`);
  const gridLabel = focusDoctor ? `Shift holder for each date, showing ${focusDoctor}` : "Shift holder for each date";
  calendarEl.innerHTML = `<table aria-label="${gridLabel}"><thead><tr>${WEEKDAYS.map(([, label]) => `<th scope="col">${label}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;

  renderCounts();
  issuesEl.innerHTML = !revealing && issues.length
    ? `<div class="issues"><p>Broken rules</p><ul>${issues.map((issue) => `<li>${issueText(parsed, issue)}</li>`).join("")}</ul></div>`
    : "";
  if (selected && state.grid) placeChooser();
  copyButton.disabled = revealing || !state.grid;
  syncRevealLock();
  if (!state.grid) {
    window.clearTimeout(copyTimer);
    copyButton.textContent = "Copy";
  }
}

function releaseGenerate() {
  generateButton.disabled = false;
  generateButton.textContent = "Generate";
}

function cancelReveal() {
  window.clearTimeout(revealTimer);
  revealTimer = 0;
  revealing = false;
  releaseGenerate();
}

function finishReveal(ticket) {
  if (ticket !== generateTicket || !revealing) return;
  revealing = false;
  window.clearTimeout(revealTimer);
  revealTimer = 0;
  renderBoard();
  releaseGenerate();
  statusEl.focus?.();
}

function startReveal(ticket) {
  revealing = true;
  renderBoard();
  const rows = calendarEl.querySelectorAll("tbody tr").length || 1;
  const lastDay = calendarEl.querySelector("tbody tr:last-child .day.arriving");
  const done = (event) => {
    if (event && event.target !== lastDay) return;
    finishReveal(ticket);
  };
  if (lastDay) lastDay.addEventListener("animationend", done);
  revealTimer = window.setTimeout(done, REVEAL_HOLD + (rows - 1) * REVEAL_GAP + REVEAL_FADE + 60);
}

function setMonth(value) {
  const next = parseMonth(value);
  if (!next || next.value === state.month) {
    monthInput.value = state.month;
    return;
  }
  generateTicket += 1;
  cancelReveal();
  state = { month: next.value, rules: blankRules(), grid: null, selected: null, reason: "" };
  focusDoctor = null;
  blockDoctor = null;
  weekdayPick = null;
  saveState();
  monthInput.value = state.month;
  renderDoctors();
  renderBoard();
}

function shiftMonth(delta) {
  const parsed = parseMonth(state.month);
  const date = new Date(parsed.year, parsed.monthIndex + delta, 1);
  setMonth(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`);
}

monthInput.addEventListener("change", () => setMonth(monthInput.value));
document.querySelector("#prev").addEventListener("click", () => shiftMonth(-1));
document.querySelector("#next").addEventListener("click", () => shiftMonth(1));
document.querySelector("#today").addEventListener("click", () => setMonth(currentMonthValue()));

function sheetText(parsed, grid) {
  const lines = [];
  for (let day = 1; day <= grid.length; day += 1) {
    const date = new Date(parsed.year, parsed.monthIndex, day);
    const formattedDate = date.toLocaleString("th-TH", {
      day: "numeric",
      month: "short",
      year: "2-digit",
    });
    const fullDay = date.toLocaleDateString("th-TH", { weekday: "long" });
    const trimmedDay = fullDay.replace(/^วัน/, "");
    lines.push([formattedDate, trimmedDay, grid[day - 1]].join("\t"));
  }
  return lines.join("\n");
}

function showCopyResult(label) {
  window.clearTimeout(copyTimer);
  copyButton.textContent = label;
  copyTimer = window.setTimeout(() => {
    copyButton.textContent = "Copy";
  }, 2000);
}

generateButton.addEventListener("click", () => {
  const ticket = ++generateTicket;
  window.clearTimeout(copyTimer);
  copyButton.textContent = "Copy";
  cancelReveal();
  generateButton.disabled = true;
  generateButton.textContent = "Working…";
  window.setTimeout(() => {
    if (ticket !== generateTicket) return;
    const parsed = parseMonth(state.month);
    const result = solve(datedDays(parsed), state.rules);
    state.selected = null;
    if (!result.ok) {
      state.grid = null;
      state.reason = result.reason;
      saveState();
      renderBoard();
      releaseGenerate();
      statusEl.focus?.();
      return;
    }
    state.grid = result.days;
    state.reason = "";
    saveState();
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      renderBoard();
      releaseGenerate();
      statusEl.focus?.();
      return;
    }
    startReveal(ticket);
  }, 20);
});

copyButton.addEventListener("click", async () => {
  if (revealing || !state.grid) return;
  const text = sheetText(parseMonth(state.month), state.grid);
  try {
    await navigator.clipboard.writeText(text);
    showCopyResult("Copied");
  } catch {
    showCopyResult("Failed");
  }
});

function setBlocked(id, day, on) {
  const blocked = new Set(state.rules[id].blocked);
  if (on) blocked.add(day);
  else blocked.delete(day);
  state.rules[id].blocked = [...blocked].sort((a, b) => a - b);
  saveState();
}

doctorsEl.addEventListener("click", (event) => {
  event.stopPropagation();
  if (revealing) return;
  const focus = event.target.closest("[data-focus]");
  if (focus) {
    const id = focus.dataset.focus;
    focusDoctor = focusDoctor === id ? null : id;
    blockDoctor = null;
    weekdayPick = null;
    renderDoctors();
    renderBoard();
    doctorsEl.querySelector(`[data-focus="${id}"]`)?.focus();
    return;
  }
  const choice = event.target.closest("[data-pick-mode]");
  if (choice) {
    const id = choice.dataset.doctor;
    const wd = Number(choice.dataset.pickWeekday);
    state.rules[id].mode[wd] = choice.dataset.pickMode;
    blockDoctor = null;
    weekdayPick = null;
    saveState();
    renderDoctors();
    renderBoard();
    doctorsEl.querySelector(`[data-weekday="${wd}"][data-doctor="${id}"]`)?.focus();
    return;
  }
  const weekday = event.target.closest("[data-weekday]");
  if (weekday) {
    const id = weekday.dataset.doctor;
    const wd = Number(weekday.dataset.weekday);
    const rule = state.rules[id];
    blockDoctor = null;
    if (rule.mode[wd] === "free") {
      const same = weekdayPick && weekdayPick.id === id && weekdayPick.wd === wd;
      weekdayPick = same ? null : { id, wd };
      renderDoctors();
      doctorsEl.querySelector(`[data-weekday="${wd}"][data-doctor="${id}"]`)?.focus();
      return;
    }
    rule.mode[wd] = "free";
    weekdayPick = null;
    saveState();
    renderDoctors();
    renderBoard();
    doctorsEl.querySelector(`[data-weekday="${wd}"][data-doctor="${id}"]`)?.focus();
    return;
  }
  const add = event.target.closest("[data-block-add]");
  if (add) {
    const id = add.dataset.blockAdd;
    blockDoctor = blockDoctor === id ? null : id;
    weekdayPick = null;
    state.selected = null;
    renderDoctors();
    renderBoard();
    doctorsEl.querySelector(`[data-block-add="${id}"]`)?.focus();
    return;
  }
  const button = event.target.closest(".block");
  if (!button) return;
  const id = button.dataset.doctor;
  const day = Number(button.dataset.day);
  setBlocked(id, day, false);
  renderDoctors();
  renderBoard();
  const next = blockDoctor === id
    ? blockPanelEl.querySelector(`[data-block-day="${day}"]`)
    : doctorsEl.querySelector(`.block[data-doctor="${id}"]`) || doctorsEl.querySelector(`[data-block-add="${id}"]`);
  next?.focus();
});

blockPanelEl.addEventListener("click", (event) => {
  event.stopPropagation();
  if (revealing) return;
  const pick = event.target.closest("[data-block-day]");
  if (!pick) return;
  const id = pick.dataset.doctor;
  const day = Number(pick.dataset.blockDay);
  const blocked = new Set(state.rules[id].blocked);
  setBlocked(id, day, !blocked.has(day));
  renderDoctors();
  renderBoard();
  blockPanelEl.querySelector(`[data-block-day="${day}"]`)?.focus();
});

calendarEl.addEventListener("click", (event) => {
  if (revealing) return;
  const button = event.target.closest("[data-select]");
  if (!button) return;
  const day = Number(button.dataset.select);
  state.selected = state.selected === day ? null : day;
  if (blockDoctor || weekdayPick) {
    blockDoctor = null;
    weekdayPick = null;
    renderDoctors();
  }
  renderBoard();
  event.stopPropagation();
});

chooserEl.addEventListener("click", (event) => {
  if (revealing) return;
  const button = event.target.closest("[data-reassign]");
  if (!button || !state.selected || !state.grid) return;
  state.grid[state.selected - 1] = button.dataset.reassign;
  state.selected = null;
  state.reason = "";
  saveState();
  renderBoard();
});

document.addEventListener("click", (event) => {
  if (revealing) return;
  if ((blockDoctor || weekdayPick) && !event.target.closest("#doctors, #block-panel")) {
    blockDoctor = null;
    weekdayPick = null;
    renderDoctors();
  }
  if (!state.selected) return;
  if (event.target.closest("[data-select], #chooser")) return;
  state.selected = null;
  renderBoard();
});

document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || revealing) return;
  if (weekdayPick) {
    const { id, wd } = weekdayPick;
    weekdayPick = null;
    renderDoctors();
    doctorsEl.querySelector(`[data-weekday="${wd}"][data-doctor="${id}"]`)?.focus();
    return;
  }
  if (blockDoctor) {
    const id = blockDoctor;
    blockDoctor = null;
    renderDoctors();
    doctorsEl.querySelector(`[data-block-add="${id}"]`)?.focus();
    return;
  }
  if (!state.selected) return;
  state.selected = null;
  renderBoard();
});

window.addEventListener("resize", () => {
  if (state.selected && state.grid) placeChooser();
  if (blockDoctor) placeBlockPanel();
});
document.querySelector(".sidebar").addEventListener("scroll", () => {
  if (blockDoctor) placeBlockPanel();
});

monthInput.value = state.month;
renderDoctors();
renderBoard();
  </script>
</body>
</html>
