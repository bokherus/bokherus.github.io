<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monthly shift</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #8e8e93;
      --line: #e6e6e8;
      --sidebar: #f5f5f7;
      --weekend: #f6f6f8;
      --accent: #007aff;
      --today: #ff3b30;
      --bad: #d70015;
      --bad-bg: #ffebe9;
      --field: #f2f2f7;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: white;
      color: var(--ink);
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas:
        "sidebar toolbar"
        "sidebar stage";
    }
    .sidebar {
      grid-area: sidebar;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 18px 12px 28px;
    }
    .side-label {
      margin: 6px 8px 4px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .doctor { padding: 10px 8px 12px; }
    .doctor + .doctor { border-top: 1px solid var(--line); }
    .doctor h2 { margin: 0 0 8px; font-size: 13px; font-weight: 650; }
    .doctor-focus {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 2px 4px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      font-weight: 650;
    }
    .doctor-focus[aria-pressed="true"] { background: var(--tint); }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--tone);
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      flex: none;
    }
    .count {
      margin-left: auto;
      color: var(--muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .rules { display: grid; gap: 6px; }
    .rule { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 6px; align-items: start; }
    .rule-toggle, .wd, .block {
      background: white;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      color: var(--ink);
    }
    .rule-toggle { width: 100%; height: 22px; padding: 0; font-size: 12px; font-weight: 590; }
    .rule-days, .blocks { display: flex; flex-wrap: wrap; gap: 4px; }
    .wd, .block {
      min-width: 28px;
      height: 22px;
      padding: 0 4px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .rule-toggle[aria-expanded="true"], .wd[aria-pressed="true"], .block[aria-pressed="true"] {
      background: var(--tone);
      border-color: transparent;
      color: white;
    }
    .blocks-label {
      width: 100%;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .issues { margin: 8px 4px 0; }
    .issues p {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--bad);
    }
    .issues ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .issues li {
      background: white;
      border: 1px solid #ffd0cc;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 12px;
      line-height: 1.35;
    }
    .toolbar {
      grid-area: toolbar;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 8px 16px;
      background: white;
    }
    .title-block { position: relative; min-width: 0; flex: 1; }
    .title-wrap { display: inline-grid; }
    .title-wrap h1, .title-wrap input { grid-area: 1 / 1; }
    h1 {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      font-size: 30px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .title-wrap input {
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .title-wrap:focus-within h1 {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 6px;
    }
    .status { margin: 3px 0 0; max-width: 560px; font-size: 12px; color: var(--muted); }
    .status.bad { color: var(--bad); }
    .status.quiet {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
    .nav { display: inline-flex; align-items: center; gap: 4px; }
    .nav button {
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      padding: 0 11px;
      font-size: 13px;
      font-weight: 510;
    }
    .nav button.icon {
      width: 28px;
      padding: 0;
      display: grid;
      place-items: center;
    }
    .nav button:hover { background: #e8e8ed; }
    .nav button:active { background: #dedee3; }
    #generate {
      height: 28px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 590;
    }
    #generate:hover { background: #0071eb; }
    #generate:disabled { opacity: 0.55; cursor: progress; }
    .stage {
      grid-area: stage;
      position: relative;
      min-height: 0;
      background: white;
      overflow: auto;
    }
    #calendar { height: 100%; user-select: none; }
    table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
    th {
      height: 28px;
      padding: 2px 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      padding: 0;
    }
    tr td:last-child { border-right: 0; }
    td.weekend { background: var(--weekend); }
    .day, .cell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background: transparent;
      border: 0;
      padding: 0;
      text-align: left;
      color: inherit;
    }
    .day.doctor-A, .day.doctor-B, .day.doctor-C, .day.doctor-D { background: var(--tint); }
    .day.dim { background: #ececef; }
    .day:hover { filter: brightness(0.97); }
    .day[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px; }
    .day:focus-visible { outline-offset: -2px; }
    .day {
      box-shadow:
        var(--seam-l, inset 0 0 0 transparent),
        var(--seam-r, inset 0 0 0 transparent),
        var(--seam-t, inset 0 0 0 transparent),
        var(--seam-b, inset 0 0 0 transparent);
    }
    .day.seam-left { --seam-l: inset 4px 0 0 var(--bad); }
    .day.seam-right { --seam-r: inset -4px 0 0 var(--bad); }
    .day.seam-sun { --seam-t: inset 0 4px 0 var(--bad); }
    .day.seam-sat { --seam-b: inset 0 -4px 0 var(--bad); }
    .corner {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--bad);
    }
    .datenum {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
      height: 28px;
      font-size: 12px;
      font-weight: 520;
      color: var(--ink);
    }
    .datenum .n {
      min-width: 22px;
      height: 22px;
      padding: 0 4px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 520;
    }
    .datenum .mon { font-weight: 520; }
    .datenum.is-out { color: #c7c7cc; }
    .datenum.is-today .n { background: var(--today); color: white; font-weight: 650; }
    .datenum.is-selected:not(.is-today) .n { background: #d1d1d6; font-weight: 650; }
    .holder {
      align-self: center;
      margin-top: 1px;
      font-size: 12px;
      font-weight: 650;
      color: var(--ink-tone);
    }
    .day.dim .holder { color: #aeaeb2; }
    #chooser {
      position: absolute;
      z-index: 5;
      width: 228px;
      padding: 12px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 10px 28px rgba(0, 0, 0, 0.18);
    }
    #chooser p {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .choices { display: grid; gap: 6px; }
    .choice {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: var(--tint);
      color: var(--ink-tone);
      font-size: 13px;
      font-weight: 650;
      text-align: left;
    }
    .choice .dot { width: 8px; height: 8px; }
    .choice:hover { background: var(--tone); color: white; }
    .choice:hover .dot { background: white; box-shadow: none; }
    .doctor-A { --tone: #34c759; --tint: #d4f5df; --ink-tone: #1d7a34; }
    .doctor-B { --tone: #30b0c7; --tint: #c9eef4; --ink-tone: #0e7490; }
    .doctor-C { --tone: #007aff; --tint: #d6e8ff; --ink-tone: #0058c4; }
    .doctor-D { --tone: #af52de; --tint: #f0d9fa; --ink-tone: #8944ab; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app {
        height: auto;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .toolbar { order: 1; align-items: flex-start; }
      .stage { order: 2; min-height: 680px; }
      .sidebar { order: 3; border-right: 0; border-bottom: 1px solid var(--line); }
      .toolbar-actions { flex-wrap: wrap; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <p class="side-label">Doctors</p>
      <section id="doctors" aria-label="Personal rules"></section>
      <div id="issues"></div>
    </aside>
    <header class="toolbar">
      <div class="title-block">
        <div class="title-wrap">
          <h1 id="month-title" aria-hidden="true"></h1>
          <input id="month" type="month" required aria-label="Month">
        </div>
        <p id="status" class="status" tabindex="-1" aria-live="polite">No plan yet.</p>
      </div>
      <div class="toolbar-actions">
        <div class="nav">
          <button id="prev" class="icon" type="button" aria-label="Previous month">
            <svg width="7" height="12" viewBox="0 0 7 12" aria-hidden="true"><path d="M6 1 1 6l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="today" type="button">Today</button>
          <button id="next" class="icon" type="button" aria-label="Next month">
            <svg width="7" height="12" viewBox="0 0 7 12" aria-hidden="true"><path d="M1 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <button id="generate" type="button">Generate</button>
      </div>
    </header>
    <main class="stage" aria-label="Plan">
      <div id="calendar"></div>
      <div id="chooser" hidden></div>
    </main>
  </div>
  <script>
const DOCTORS = ["A", "B", "C", "D"];

function monthDays(year, monthIndex) {
  const n = new Date(year, monthIndex + 1, 0).getDate();
  const days = [];
  for (let day = 1; day <= n; day += 1) {
    days.push({ day, weekday: new Date(year, monthIndex, day).getDay() });
  }
  return days;
}

function blankRules() {
  const rules = {};
  for (const id of DOCTORS) {
    rules[id] = {
      mode: { 0: "free", 1: "free", 2: "free", 3: "free", 4: "free", 5: "free", 6: "free" },
      blocked: [],
    };
  }
  return rules;
}

function modeCode(mode) {
  if (mode === "ban") return 1;
  if (mode === "cap") return 2;
  return 0;
}

function prepare(days, rules) {
  const n = days.length;
  const minCount = Math.floor(n / 4);
  const maxCount = Math.ceil(n / 4);
  const weekday = new Uint8Array(n + 1);
  const blocked = [null, null, null, null].map(() => new Uint8Array(n + 1));
  const mode = [null, null, null, null].map(() => new Uint8Array(7));
  days.forEach((item, index) => {
    weekday[index + 1] = item.weekday;
  });
  DOCTORS.forEach((id, doctor) => {
    const rule = rules[id];
    for (let wd = 0; wd < 7; wd += 1) mode[doctor][wd] = modeCode(rule.mode[wd]);
    for (const day of rule.blocked) {
      if (day >= 1 && day <= n) blocked[doctor][day] = 1;
    }
  });
  return { n, minCount, maxCount, weekday, blocked, mode, days };
}

function explain(ctx, rules) {
  const { n, minCount, days, weekday, blocked, mode } = ctx;
  for (let day = 1; day <= n; day += 1) {
    const wd = weekday[day];
    let holder = false;
    for (let doctor = 0; doctor < 4; doctor += 1) {
      if (!blocked[doctor][day] && mode[doctor][wd] !== 1) holder = true;
    }
    if (!holder) {
      const when = formatDay(ctx, day);
      return `${when} has no legal holder. Every doctor is blocked or banned that day.`;
    }
  }

  const weekdayName = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  for (let wd = 1; wd <= 7; wd += 1) {
    const weekdayIndex = wd % 7;
    const dates = [];
    for (let day = 1; day <= n; day += 1) if (weekday[day] === weekdayIndex) dates.push(day);
    if (dates.length === 0) continue;
    let cover = 0;
    for (let doctor = 0; doctor < 4; doctor += 1) {
      const available = dates.filter((day) => !blocked[doctor][day]).length;
      const kind = mode[doctor][weekdayIndex];
      if (kind === 1 || available === 0) continue;
      cover += kind === 2 ? 1 : available;
    }
    if (cover < dates.length) {
      const name = weekdayName[weekdayIndex];
      return `${name} cannot be covered. Bans and caps allow ${cover} Shift${cover === 1 ? "" : "s"} for ${dates.length} ${name}s.`;
    }
  }

  for (let doctor = 0; doctor < 4; doctor += 1) {
    let most = 0;
    for (let wd = 0; wd < 7; wd += 1) {
      if (mode[doctor][wd] === 1) continue;
      let available = 0;
      for (let day = 1; day <= n; day += 1) {
        if (weekday[day] === wd && !blocked[doctor][day]) available += 1;
      }
      if (available === 0) continue;
      most += mode[doctor][wd] === 2 ? 1 : available;
    }
    if (most < minCount) {
      return `${DOCTORS[doctor]} can hold at most ${most} Shift${most === 1 ? "" : "s"} under these rules. Balance needs at least ${minCount}.`;
    }
  }
  return "";
}

function formatDay(ctx, day) {
  const item = ctx.days[day - 1];
  if (item.year == null) return `Day ${day}`;
  return new Date(item.year, item.monthIndex, day).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "long",
    year: "numeric",
  });
}

function stretchKey(assignment) {
  const n = assignment.length;
  const stretches = [];
  for (let doctor = 0; doctor < 4; doctor += 1) {
    const held = [];
    for (let index = 0; index < n; index += 1) if (assignment[index] === doctor) held.push(index + 1);
    if (held.length === 0) {
      stretches.push(n);
      continue;
    }
    if (held[0] > 1) stretches.push(held[0] - 1);
    for (let i = 1; i < held.length; i += 1) {
      const gap = held[i] - held[i - 1] - 1;
      if (gap > 0) stretches.push(gap);
    }
    if (held[held.length - 1] < n) stretches.push(n - held[held.length - 1]);
  }
  stretches.sort((a, b) => b - a);
  return stretches;
}

function hasCap(ctx, doctor) {
  for (let wd = 0; wd < 7; wd += 1) if (ctx.mode[doctor][wd] === 2) return true;
  return false;
}

function canHold(ctx, doctor, day) {
  const wd = ctx.weekday[day];
  return !ctx.blocked[doctor][day] && ctx.mode[doctor][wd] !== 1;
}

function stretchLowerBound(ctx) {
  const must = [0, 1, 2, 3].map(() => []);
  for (let day = 1; day <= ctx.n; day += 1) {
    const possible = [];
    for (let doctor = 0; doctor < 4; doctor += 1) if (canHold(ctx, doctor, day)) possible.push(doctor);
    if (possible.length === 1) must[possible[0]].push(day);
  }

  let bound = 0;
  for (let doctor = 0; doctor < 4; doctor += 1) {
    if (hasCap(ctx, doctor)) continue;
    const needed = new Set(must[doctor]);
    let lo = 0;
    let hi = ctx.n;
    let best = null;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (fitsStretch(ctx, doctor, needed, mid)) {
        best = mid;
        hi = mid - 1;
      } else lo = mid + 1;
    }
    if (best === null) return Number.POSITIVE_INFINITY;
    if (best > bound) bound = best;
  }
  return bound;
}

function fitsStretch(ctx, doctor, needed, limit) {
  const n = ctx.n;
  const maxK = ctx.maxCount;
  let prev = Array.from({ length: maxK + 1 }, () => new Uint8Array(n + 1));
  prev[0][0] = 1;
  for (let day = 1; day <= n; day += 1) {
    const next = Array.from({ length: maxK + 1 }, () => new Uint8Array(n + 1));
    for (let used = 0; used <= maxK; used += 1) {
      for (let last = 0; last < day; last += 1) {
        if (!prev[used][last]) continue;
        if (!needed.has(day) && day - last <= limit) next[used][last] = 1;
        if (used < maxK && canHold(ctx, doctor, day) && (last === 0 || day !== last + 1)) {
          if (day - last - 1 <= limit) next[used + 1][day] = 1;
        }
      }
    }
    prev = next;
  }
  for (let used = ctx.minCount; used <= maxK; used += 1) {
    for (let last = 0; last <= n; last += 1) {
      if (prev[used][last] && n - last <= limit) return true;
    }
  }
  return false;
}

function betterTallies(a, b) {
  for (let stretch = a.length - 1; stretch >= 1; stretch -= 1) {
    if (a[stretch] !== b[stretch]) return a[stretch] < b[stretch];
  }
  return false;
}

function sameTallies(a, b) {
  for (let stretch = 1; stretch < a.length; stretch += 1) if (a[stretch] !== b[stretch]) return false;
  return true;
}

function talliesToKey(tallies) {
  const key = [];
  for (let stretch = tallies.length - 1; stretch >= 1; stretch -= 1) {
    for (let count = 0; count < tallies[stretch]; count += 1) key.push(stretch);
  }
  return key;
}

function searchLimit(ctx, limit, rng) {
  const { n, maxCount, minCount, weekday, mode } = ctx;
  const history = limit + 1;
  const window = limit + 1;
  const slots = [];
  const slotAt = [0, 1, 2, 3].map(() => new Int8Array(7).fill(-1));
  for (let doctor = 0; doctor < 4; doctor += 1) {
    for (let wd = 0; wd < 7; wd += 1) {
      if (mode[doctor][wd] === 2) {
        slotAt[doctor][wd] = slots.length;
        slots.push(1);
      }
    }
  }

  const layers = [];
  let layer = new Map();
  layer.set(`0000||${"0".repeat(slots.length)}`, {
    hist: [],
    counts: [0, 0, 0, 0],
    cap: slots.length ? new Uint8Array(slots.length) : new Uint8Array(0),
    tallies: new Uint16Array(limit + 1),
    ways: 1,
    pred: [0, 0, 0, 0],
  });
  layers[0] = layer;
  let nodes = 1;

  for (let day = 1; day <= n; day += 1) {
    const next = new Map();
    const wd = weekday[day];
    for (const state of layer.values()) {
      for (let doctor = 0; doctor < 4; doctor += 1) {
        if (state.hist.length && state.hist[state.hist.length - 1] === doctor) continue;
        if (!canHold(ctx, doctor, day) || state.counts[doctor] >= maxCount) continue;
        const slot = slots.length ? slotAt[doctor][wd] : -1;
        if (slot >= 0 && state.cap[slot]) continue;

        let prevDay = 0;
        for (let index = 0; index < state.hist.length; index += 1) {
          if (state.hist[index] === doctor) prevDay = day - state.hist.length + index;
        }
        const tallies = state.tallies.slice();
        if (prevDay === 0) {
          if (day - 1 > limit) continue;
          if (day > 1) tallies[day - 1] += 1;
        } else {
          const gap = day - prevDay - 1;
          if (gap > limit) continue;
          if (gap > 0) tallies[gap] += 1;
        }

        const dropping = state.hist.length === history;
        if (day >= window) {
          const seen = new Set(dropping ? state.hist.slice(1) : state.hist);
          seen.add(doctor);
          if (seen.size < 4) continue;
        }

        const newHist = dropping ? state.hist.slice(1).concat(doctor) : state.hist.concat(doctor);
        const newCounts = state.counts.slice();
        newCounts[doctor] += 1;
        const newCap = state.cap.slice();
        if (slot >= 0) newCap[slot] = 1;
        const key = `${newCounts.join("")}|${newHist.join("")}|${newCap.join("")}`;
        const dropped = dropping ? state.hist[0] : -1;
        const existing = next.get(key);
        if (!existing || betterTallies(tallies, existing.tallies)) {
          const pred = [0, 0, 0, 0];
          if (dropped >= 0) pred[dropped] = state.ways;
          next.set(key, {
            hist: newHist,
            counts: newCounts,
            cap: newCap,
            tallies,
            ways: state.ways,
            pred,
          });
        } else if (sameTallies(tallies, existing.tallies)) {
          existing.ways += state.ways;
          if (dropped >= 0) existing.pred[dropped] += state.ways;
        }
      }
    }
    nodes += next.size;
    if (next.size === 0) return { nodes, chosen: null, ties: 0, key: null };
    layer = next;
    layers[day] = layer;
  }

  let best = null;
  let total = 0;
  const endings = [];
  for (const state of layer.values()) {
    if (state.counts.some((value, doctor) => value < minCount)) continue;
    const finalTallies = state.tallies.slice();
    for (let doctor = 0; doctor < 4; doctor += 1) {
      let lastDay = 0;
      for (let index = 0; index < state.hist.length; index += 1) {
        if (state.hist[index] === doctor) lastDay = n - state.hist.length + 1 + index;
      }
      const after = n - lastDay;
      if (after > 0) finalTallies[after] += 1;
    }
    if (!best || betterTallies(finalTallies, best)) {
      best = finalTallies;
      endings.length = 0;
      total = 0;
    }
    if (sameTallies(finalTallies, best)) {
      endings.push(state);
      total += state.ways;
    }
  }
  if (!total) return { nodes, chosen: null, ties: 0, key: null };

  let ticket = Math.floor(rng() * total);
  let chosenState = endings[endings.length - 1];
  for (const state of endings) {
    if (ticket < state.ways) {
      chosenState = state;
      break;
    }
    ticket -= state.ways;
  }

  const plan = new Array(n);
  let state = chosenState;
  for (let day = n; day >= 1; day -= 1) {
    const doctor = state.hist[state.hist.length - 1];
    plan[day - 1] = doctor;
    if (day === 1) break;
    let prevHist;
    if (day > history) {
      let cursor = Math.floor(rng() * state.pred.reduce((sum, value) => sum + value, 0));
      let dropped = 0;
      for (; dropped < 3; dropped += 1) {
        if (cursor < state.pred[dropped]) break;
        cursor -= state.pred[dropped];
      }
      prevHist = [dropped].concat(state.hist.slice(0, -1));
    } else {
      prevHist = state.hist.slice(0, -1);
    }
    const prevCounts = state.counts.slice();
    prevCounts[doctor] -= 1;
    const prevCap = state.cap.slice();
    const slot = slotAt[doctor][weekday[day]];
    if (slot >= 0) prevCap[slot] = 0;
    const prevKey = `${prevCounts.join("")}|${prevHist.join("")}|${prevCap.join("")}`;
    state = layers[day - 1].get(prevKey);
  }

  return { nodes, chosen: plan, ties: total, key: talliesToKey(best) };
}

function solve(days, rules, rng = Math.random) {
  const dated = days.map((item) => ({ ...item }));
  const ctx = prepare(dated, rules);
  const reason = explain(ctx, rules);
  if (reason) return { ok: false, reason, nodes: 0, ties: 0 };

  const lower = stretchLowerBound(ctx);
  if (!Number.isFinite(lower)) {
    return {
      ok: false,
      reason: "No plan meets these rules. Consecutive Shifts and the personal rules cannot be satisfied together.",
      nodes: 0,
      ties: 0,
      truncated: false,
      lower,
    };
  }
  let nodes = 0;
  for (let limit = lower; limit <= ctx.n; limit += 1) {
    const found = searchLimit(ctx, limit, rng);
    nodes += found.nodes;
    if (!found.chosen) continue;
    return {
      ok: true,
      days: found.chosen.map((doctor) => DOCTORS[doctor]),
      key: found.key,
      nodes,
      ties: found.ties,
      truncated: false,
      lower,
    };
  }
  return {
    ok: false,
    reason: "No plan meets these rules. Consecutive Shifts and the personal rules cannot be satisfied together.",
    nodes,
    ties: 0,
    truncated: false,
    lower,
  };
}

function evaluate(days, rules, letters) {
  const ctx = prepare(days, rules);
  const assignment = letters.map((letter) => DOCTORS.indexOf(letter));
  const issues = [];
  for (let index = 1; index < assignment.length; index += 1) {
    if (assignment[index] === assignment[index - 1]) {
      issues.push({ type: "consecutive", days: [index, index + 1], doctor: DOCTORS[assignment[index]] });
    }
  }
  for (let index = 0; index < assignment.length; index += 1) {
    const doctor = assignment[index];
    const day = index + 1;
    const wd = ctx.weekday[day];
    if (ctx.blocked[doctor][day]) issues.push({ type: "blocked", days: [day], doctor: DOCTORS[doctor] });
    else if (ctx.mode[doctor][wd] === 1) issues.push({ type: "ban", days: [day], doctor: DOCTORS[doctor] });
  }
  for (let doctor = 0; doctor < 4; doctor += 1) {
    for (let wd = 0; wd < 7; wd += 1) {
      if (ctx.mode[doctor][wd] !== 2) continue;
      const held = [];
      for (let day = 1; day <= ctx.n; day += 1) {
        if (ctx.weekday[day] === wd && assignment[day - 1] === doctor) held.push(day);
      }
      if (held.length > 1) issues.push({ type: "cap", days: held, doctor: DOCTORS[doctor], weekday: wd });
    }
  }
  const counts = [0, 0, 0, 0];
  for (const doctor of assignment) counts[doctor] += 1;
  if (Math.max(...counts) - Math.min(...counts) > 1) {
    issues.push({ type: "balance", counts: counts.map((value, doctor) => [DOCTORS[doctor], value]) });
  }
  return issues;
}


const STORAGE_KEY = "turbo-shift-v1";
const WEEKDAYS = [[0, "Sun"], [1, "Mon"], [2, "Tue"], [3, "Wed"], [4, "Thu"], [5, "Fri"], [6, "Sat"]];
const WEEKDAY_NAME = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const monthInput = document.querySelector("#month");
const monthTitleEl = document.querySelector("#month-title");
const generateButton = document.querySelector("#generate");
const doctorsEl = document.querySelector("#doctors");
const statusEl = document.querySelector("#status");
const chooserEl = document.querySelector("#chooser");
const calendarEl = document.querySelector("#calendar");
const issuesEl = document.querySelector("#issues");

let state = loadState();
let openRules = {};
let focusDoctor = null;

function currentMonthValue() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
}

function parseMonth(value) {
  const match = /^(\d{4})-(\d{2})$/.exec(value || "");
  if (!match) return null;
  const monthIndex = Number(match[2]) - 1;
  if (monthIndex < 0 || monthIndex > 11) return null;
  return { year: Number(match[1]), monthIndex, value: `${match[1]}-${match[2]}` };
}

function datedDays(parsed) {
  return monthDays(parsed.year, parsed.monthIndex).map((item) => ({
    ...item,
    year: parsed.year,
    monthIndex: parsed.monthIndex,
  }));
}

function beTitle(parsed) {
  return `${MONTHS[parsed.monthIndex]} ${parsed.year + 543} BE`;
}

function monthGrid(parsed) {
  const first = new Date(parsed.year, parsed.monthIndex, 1);
  const last = new Date(parsed.year, parsed.monthIndex + 1, 0);
  const start = new Date(parsed.year, parsed.monthIndex, 1 - first.getDay());
  const end = new Date(parsed.year, parsed.monthIndex, last.getDate() + (6 - last.getDay()));
  const dates = [];
  for (let cursor = new Date(start); cursor <= end; cursor.setDate(cursor.getDate() + 1)) {
    dates.push(new Date(cursor));
  }
  return dates;
}

function loadState() {
  const fresh = () => ({ month: currentMonthValue(), rules: blankRules(), grid: null, selected: null, reason: "" });
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    const parsed = saved && parseMonth(saved.month);
    if (!parsed || !saved.rules) return fresh();
    const days = datedDays(parsed);
    const rules = blankRules();
    for (const id of DOCTORS) {
      const incoming = saved.rules[id] || {};
      for (let wd = 0; wd < 7; wd += 1) {
        const mode = incoming.mode?.[wd] ?? incoming.mode?.[String(wd)];
        if (mode === "free" || mode === "ban" || mode === "cap") rules[id].mode[wd] = mode;
      }
      if (Array.isArray(incoming.blocked)) {
        rules[id].blocked = incoming.blocked.filter((day) => Number.isInteger(day) && day >= 1 && day <= days.length);
      }
    }
    const grid = Array.isArray(saved.grid) && saved.grid.length === days.length && saved.grid.every((id) => DOCTORS.includes(id))
      ? saved.grid.slice()
      : null;
    return { month: parsed.value, rules, grid, selected: null, reason: "" };
  } catch {
    return fresh();
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ month: state.month, rules: state.rules, grid: state.grid }));
}

function formatDay(parsed, day) {
  return new Date(parsed.year, parsed.monthIndex, day).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "long",
    year: "numeric",
  });
}

const RULE_LABEL = { ban: "Ban", cap: "Cap" };

function ruleRow(id, rule, mode) {
  const open = Boolean(openRules[id]?.[mode]);
  const days = WEEKDAYS.filter(([wd]) => rule.mode[wd] === mode || (open && rule.mode[wd] === "free"));
  const chips = days.map(([wd, label]) => `
    <button type="button" class="wd" data-doctor="${id}" data-mode="${mode}" data-weekday="${wd}" aria-pressed="${rule.mode[wd] === mode}" aria-label="${RULE_LABEL[mode]} ${WEEKDAY_NAME[wd]} for ${id}">${label}</button>`).join("");
  return `
    <div class="rule">
      <button type="button" class="rule-toggle" data-doctor="${id}" data-rule="${mode}" aria-expanded="${open}" aria-label="${RULE_LABEL[mode]} weekdays for ${id}">${RULE_LABEL[mode]}</button>
      <div class="rule-days">${chips}</div>
    </div>`;
}

function renderCounts() {
  const tally = Object.fromEntries(DOCTORS.map((id) => [id, 0]));
  if (state.grid) for (const id of state.grid) tally[id] += 1;
  for (const id of DOCTORS) {
    const el = doctorsEl.querySelector(`[data-count="${id}"]`);
    if (el) el.textContent = state.grid ? String(tally[id]) : "";
  }
}

function renderDoctors() {
  const parsed = parseMonth(state.month);
  const days = datedDays(parsed);
  doctorsEl.innerHTML = DOCTORS.map((id) => {
    const rule = state.rules[id];
    const blocked = new Set(rule.blocked);
    const blocks = days.map((item) => `
      <button type="button" class="block" data-doctor="${id}" data-day="${item.day}" aria-pressed="${blocked.has(item.day)}" aria-label="Block ${formatDay(parsed, item.day)} for ${id}">${item.day}</button>`).join("");
    return `
      <article class="doctor doctor-${id}">
        <h2><button type="button" class="doctor-focus" data-focus="${id}" aria-pressed="${focusDoctor === id}" aria-label="${focusDoctor === id ? `Showing ${id} on the month` : `Show ${id} on the month`}"><span class="dot" aria-hidden="true"></span>${id}<span class="count" data-count="${id}"></span></button></h2>
        <div class="rules">${ruleRow(id, rule, "ban")}${ruleRow(id, rule, "cap")}</div>
        <div class="blocks"><span class="blocks-label">Blocked</span>${blocks}</div>
      </article>`;
  }).join("");
  renderCounts();
}

function issueText(parsed, issue) {
  const when = (day) => formatDay(parsed, day);
  if (issue.type === "consecutive") return `${issue.doctor} holds ${when(issue.days[0])} and ${when(issue.days[1])}.`;
  if (issue.type === "blocked") return `${issue.doctor} holds ${when(issue.days[0])}, which is blocked.`;
  if (issue.type === "ban") return `${issue.doctor} holds ${when(issue.days[0])}, which is banned.`;
  if (issue.type === "cap") {
    const name = WEEKDAY_NAME[issue.weekday];
    return `${issue.doctor} holds more than one ${name}: ${issue.days.map(when).join(" and ")}.`;
  }
  const counts = issue.counts.map(([id, value]) => `${id} ${value}`).join(", ");
  return `Balance is missed. Shifts are ${counts}.`;
}

function placeChooser() {
  const anchor = calendarEl.querySelector(`[data-select="${state.selected}"]`);
  const stage = calendarEl.closest(".stage");
  if (!anchor || !stage) return;
  const a = anchor.getBoundingClientRect();
  const s = stage.getBoundingClientRect();
  const margin = 8;
  const width = chooserEl.offsetWidth;
  const height = chooserEl.offsetHeight;
  let left = a.left - s.left + stage.scrollLeft + margin;
  let top = a.bottom - s.top + stage.scrollTop + 6;
  const limitX = stage.scrollLeft + s.width;
  const limitY = stage.scrollTop + s.height;
  if (left + width > limitX - margin) left = limitX - width - margin;
  if (left < stage.scrollLeft + margin) left = stage.scrollLeft + margin;
  if (top + height > limitY - margin) top = a.top - s.top + stage.scrollTop - height - 6;
  if (top < stage.scrollTop + margin) top = stage.scrollTop + margin;
  chooserEl.style.left = `${left}px`;
  chooserEl.style.top = `${top}px`;
}

function renderBoard() {
  const parsed = parseMonth(state.month);
  const days = datedDays(parsed);
  const issues = state.grid ? evaluate(days, state.rules, state.grid) : [];
  const corners = new Set();
  for (const issue of issues) {
    if (issue.type === "blocked" || issue.type === "ban" || issue.type === "cap") {
      for (const day of issue.days) corners.add(day);
    }
  }
  const seams = new Map();
  const markSeam = (day, edge) => {
    const entry = seams.get(day) || {};
    entry[edge] = true;
    seams.set(day, entry);
  };
  if (state.grid) {
    for (let day = 1; day < state.grid.length; day += 1) {
      if (state.grid[day - 1] !== state.grid[day]) continue;
      const weekday = new Date(parsed.year, parsed.monthIndex, day).getDay();
      if (weekday === 6) markSeam(day, "sat");
      else markSeam(day, "right");
    }
  }
  const now = new Date();
  const title = beTitle(parsed);

  monthTitleEl.textContent = title;
  monthInput.setAttribute("aria-label", title);
  document.title = `${title} · Monthly shift`;

  if (state.reason) {
    statusEl.textContent = state.reason;
    statusEl.classList.add("bad");
    statusEl.classList.remove("quiet");
  } else if (!state.grid) {
    statusEl.textContent = "No plan yet.";
    statusEl.classList.remove("bad", "quiet");
  } else if (issues.length) {
    statusEl.textContent = "This grid breaks a rule.";
    statusEl.classList.add("bad");
    statusEl.classList.remove("quiet");
  } else {
    statusEl.textContent = "Plan ready.";
    statusEl.classList.remove("bad");
    statusEl.classList.add("quiet");
  }

  const selected = state.selected;
  if (selected && state.grid) {
    const holder = state.grid[selected - 1];
    const others = DOCTORS.filter((id) => id !== holder).map((id) =>
      `<button type="button" class="choice doctor-${id}" data-reassign="${id}"><span class="dot" aria-hidden="true"></span>${id}</button>`).join("");
    chooserEl.hidden = false;
    chooserEl.innerHTML = `<p>Give ${formatDay(parsed, selected)} to</p><div class="choices">${others}</div>`;
  } else {
    chooserEl.hidden = true;
    chooserEl.innerHTML = "";
  }

  const cells = monthGrid(parsed).map((date) => {
    const inMonth = date.getFullYear() === parsed.year && date.getMonth() === parsed.monthIndex;
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    const isToday = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
    const day = date.getDate();
    const numClass = ["datenum"];
    if (!inMonth) numClass.push("is-out");
    if (isToday) numClass.push("is-today");
    if (inMonth && selected === day) numClass.push("is-selected");
    const mon = day === 1 ? `<span class="mon">${MONTHS_SHORT[date.getMonth()]}</span>` : "";
    const num = `<span class="${numClass.join(" ")}"><span class="n">${day}</span>${mon}</span>`;
    const tdClass = weekend ? "weekend" : "";
    if (!inMonth || !state.grid) {
      return `<td class="${tdClass}"><div class="cell"${isToday ? ` aria-current="date"` : ""}>${num}</div></td>`;
    }
    const holder = state.grid[day - 1];
    const pressed = selected === day;
    const seam = seams.get(day) || {};
    const corner = corners.has(day);
    const dim = focusDoctor && holder !== focusDoctor;
    const dayClass = [
      "day",
      `doctor-${holder}`,
      dim ? "dim" : "",
      seam.left ? "seam-left" : "",
      seam.right ? "seam-right" : "",
      seam.sat ? "seam-sat" : "",
      seam.sun ? "seam-sun" : "",
    ].filter(Boolean).join(" ");
    const notes = [];
    if (seam.left || seam.right || seam.sat || seam.sun) notes.push("consecutive");
    if (corner) notes.push("broken");
    return `<td class="${tdClass}"><button type="button" class="${dayClass}" data-doctor="${holder}" data-select="${day}" aria-pressed="${pressed}"${isToday ? ` aria-current="date"` : ""} aria-label="${formatDay(parsed, day)}, ${holder}${notes.length ? `, ${notes.join(", ")}` : ""}">${num}<span class="holder">${holder}</span>${corner ? `<span class="corner" aria-hidden="true"></span>` : ""}</button></td>`;
  });
  const rows = [];
  for (let index = 0; index < cells.length; index += 7) rows.push(`<tr>${cells.slice(index, index + 7).join("")}</tr>`);
  const gridLabel = focusDoctor ? `Shift holder for each date, showing ${focusDoctor}` : "Shift holder for each date";
  calendarEl.innerHTML = `<table aria-label="${gridLabel}"><thead><tr>${WEEKDAYS.map(([, label]) => `<th scope="col">${label}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`;

  renderCounts();
  issuesEl.innerHTML = issues.length
    ? `<div class="issues"><p>Broken rules</p><ul>${issues.map((issue) => `<li>${issueText(parsed, issue)}</li>`).join("")}</ul></div>`
    : "";
  if (selected && state.grid) placeChooser();
}

function setMonth(value) {
  const next = parseMonth(value);
  if (!next || next.value === state.month) {
    monthInput.value = state.month;
    return;
  }
  state = { month: next.value, rules: blankRules(), grid: null, selected: null, reason: "" };
  openRules = {};
  focusDoctor = null;
  saveState();
  monthInput.value = state.month;
  renderDoctors();
  renderBoard();
}

function shiftMonth(delta) {
  const parsed = parseMonth(state.month);
  const date = new Date(parsed.year, parsed.monthIndex + delta, 1);
  setMonth(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`);
}

monthInput.addEventListener("change", () => setMonth(monthInput.value));
document.querySelector("#prev").addEventListener("click", () => shiftMonth(-1));
document.querySelector("#next").addEventListener("click", () => shiftMonth(1));
document.querySelector("#today").addEventListener("click", () => setMonth(currentMonthValue()));

generateButton.addEventListener("click", () => {
  generateButton.disabled = true;
  generateButton.textContent = "Working…";
  window.setTimeout(() => {
    const parsed = parseMonth(state.month);
    const result = solve(datedDays(parsed), state.rules);
    state.selected = null;
    if (result.ok) {
      state.grid = result.days;
      state.reason = "";
    } else {
      state.grid = null;
      state.reason = result.reason;
    }
    saveState();
    renderBoard();
    generateButton.disabled = false;
    generateButton.textContent = "Generate";
    statusEl.focus?.();
  }, 20);
});

doctorsEl.addEventListener("click", (event) => {
  const focus = event.target.closest("[data-focus]");
  if (focus) {
    const id = focus.dataset.focus;
    focusDoctor = focusDoctor === id ? null : id;
    renderDoctors();
    renderBoard();
    doctorsEl.querySelector(`[data-focus="${id}"]`)?.focus();
    return;
  }
  const toggle = event.target.closest("[data-rule]");
  if (toggle) {
    const id = toggle.dataset.doctor;
    const mode = toggle.dataset.rule;
    const open = openRules[id] || (openRules[id] = {});
    open[mode] = !open[mode];
    renderDoctors();
    doctorsEl.querySelector(`[data-doctor="${id}"][data-rule="${mode}"]`)?.focus();
    return;
  }
  const weekday = event.target.closest("[data-weekday]");
  if (weekday) {
    const id = weekday.dataset.doctor;
    const mode = weekday.dataset.mode;
    const wd = Number(weekday.dataset.weekday);
    const rule = state.rules[id];
    rule.mode[wd] = rule.mode[wd] === mode ? "free" : mode;
    if (openRules[id]) openRules[id][mode] = false;
    saveState();
    renderDoctors();
    renderBoard();
    doctorsEl.querySelector(`[data-doctor="${id}"][data-rule="${mode}"]`)?.focus();
    return;
  }
  const button = event.target.closest(".block");
  if (!button) return;
  const id = button.dataset.doctor;
  const day = Number(button.dataset.day);
  const blocked = new Set(state.rules[id].blocked);
  if (blocked.has(day)) blocked.delete(day);
  else blocked.add(day);
  state.rules[id].blocked = [...blocked].sort((a, b) => a - b);
  button.setAttribute("aria-pressed", String(blocked.has(day)));
  saveState();
  renderBoard();
});

calendarEl.addEventListener("click", (event) => {
  const button = event.target.closest("[data-select]");
  if (!button) return;
  const day = Number(button.dataset.select);
  state.selected = state.selected === day ? null : day;
  renderBoard();
  event.stopPropagation();
});

chooserEl.addEventListener("click", (event) => {
  const button = event.target.closest("[data-reassign]");
  if (!button || !state.selected || !state.grid) return;
  state.grid[state.selected - 1] = button.dataset.reassign;
  state.selected = null;
  state.reason = "";
  saveState();
  renderBoard();
});

document.addEventListener("click", (event) => {
  if (!state.selected) return;
  if (event.target.closest("[data-select], #chooser")) return;
  state.selected = null;
  renderBoard();
});

document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape" || !state.selected) return;
  state.selected = null;
  renderBoard();
});

window.addEventListener("resize", () => {
  if (state.selected && state.grid) placeChooser();
});

monthInput.value = state.month;
renderDoctors();
renderBoard();
  </script>
</body>
